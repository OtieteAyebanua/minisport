<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Minisport: race, fly and skate through a giant toon house</title>
    <meta
      name="description"
      content="A tiny toon racing game in your browser. Pick a street racer, a hover ship or a skater and tear around a giant house: drift under the sofa, fly over the table, ollie the rug."
    />
    <meta name="theme-color" content="#17131f" />
    <meta name="color-scheme" content="dark" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Link previews (Facebook, WhatsApp, Discord, Slack, iMessage…).
         VITE_SITE_URL in .env must be the site's public URL for the image
         to show up when the link is shared. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Minisport" />
    <meta property="og:title" content="Minisport: race, fly and skate through a giant toon house" />
    <meta
      property="og:description"
      content="Pick a street racer, a hover ship or a skater and tear around a giant toon house. Plays right in your browser."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/banner.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Minisport banner: a toon street racer, hover ship and skater."
    />

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Minisport: race, fly and skate through a giant toon house" />
    <meta
      name="twitter:description"
      content="Pick a street racer, a hover ship or a skater and tear around a giant toon house. Plays right in your browser."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/banner.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
